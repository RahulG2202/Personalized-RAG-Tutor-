services:
  - type: web
    name: rag-tutor-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: rag-tutor-ai-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PREFIX
        value: materials
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://personalized-rag-tutor.vercel.app
