services:
  - type: keyvalue
    name: rag-tutor-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: rag-tutor-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: rag-tutor-ai-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --timeout 120 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: EMBEDDING_MODEL
        value: ibm-granite/granite-embedding-97m-multilingual-r2
      - key: EMBEDDING_DIMENSIONS
        value: 384
      - key: HUGGINGFACE_EMBEDDING_API_URL
        value: https://router.huggingface.co/hf-inference
      - key: HYBRID_ALPHA
        value: 0.5
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PREFIX
        value: materials
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://personalized-rag-tutor.vercel.app
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rag-tutor-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: rag-tutor-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: rag-tutor-redis
          property: connectionString
